# Publishes the dashboard (web/) to GitHub Pages.
#
# One-time setup: repo → Settings → Pages → Build and deployment → Source:
# "GitHub Actions". After that, every push to main redeploys automatically.
#
# Only web/ is published — the firmware, tools and docs stay in the repo but
# are not served. The ESP32 keeps serving its own embedded page (web_page.h).
name: Deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
